name: zynth_browser
description: "Zynth Browser — An Android-first, performance-focused browser with OM Search integration."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.1.0
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
