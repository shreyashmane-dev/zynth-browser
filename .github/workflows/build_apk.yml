name: Build Zynth Browser APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Ensure Android Gradle Wrapper & Platform
        run: |
          mkdir -p /tmp/zynth_bak
          cp -r android/app/src /tmp/zynth_bak/src
          cp android/app/build.gradle /tmp/zynth_bak/build.gradle
          cp android/app/proguard-rules.pro /tmp/zynth_bak/proguard-rules.pro

          flutter create . --platforms=android --org com.zynth

          cp /tmp/zynth_bak/build.gradle android/app/build.gradle
          cp /tmp/zynth_bak/proguard-rules.pro android/app/proguard-rules.pro
          cp -r /tmp/zynth_bak/src/* android/app/src/
          chmod +x android/gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zynthbrowser -keypass zynthbrowser \
            -dname "CN=Zynth Browser, OU=Mobile, O=Zynth, L=San Francisco, S=CA, C=US"

      - name: Get dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Locate and Collect Generated APKs
        run: |
          mkdir -p dist
          find build/ -name "*.apk" -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Upload All APK Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zynth-browser-apks
          path: dist/*.apk
          if-no-files-found: error
