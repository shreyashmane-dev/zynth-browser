name: Build Zynth Browser APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zynthbrowser -keypass zynthbrowser \
            -dname "CN=Zynth Browser, OU=Mobile, O=Zynth, L=San Francisco, S=CA, C=US"

      - name: Get dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Debug APK
        run: |
          flutter build apk --debug -v 2>&1 | tee build_debug.log

      - name: Build Release APK
        run: |
          flutter build apk --release -v 2>&1 | tee build_release.log

      - name: Locate Generated APKs
        run: |
          echo "=== SEARCHING FOR ALL GENERATED APKS ==="
          find . -name "*.apk" -ls

      - name: Upload All APK Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zynth-browser-apks
          path: "**/*.apk"
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zynth-browser-build-logs
          path: |
            build_debug.log
            build_release.log
          if-no-files-found: ignore
